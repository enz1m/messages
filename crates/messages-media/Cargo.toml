[package]
name = "messages-media"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
[dependencies]
tokio = { version = "1", features = ["process", "io-util", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[lints.rust]
unsafe_code = "forbid"
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
