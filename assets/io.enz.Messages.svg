<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Messages</title>
  <defs>
    <filter id="enz-messages-drop" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- square keyline; card 84 x 82 (22..106 x 23..105) with a green sheet turned -7 deg;
       incoming grey bubbles on the left, an outgoing green bubble on the right, typing dots in the last one -->
  <g filter="url(#enz-messages-drop)">
    <rect x="22" y="23" width="84" height="82" rx="9" fill="#34C759" transform="rotate(-7 64 64)"/>
    <rect x="22" y="23" width="84" height="82" rx="9" fill="#FFFFFF"/>
  </g>
  <rect x="30" y="32" width="46" height="18" rx="9" fill="#E3E8F0"/>
  <rect x="50" y="56" width="48" height="18" rx="9" fill="#34C759"/>
  <rect x="58" y="63" width="28" height="4" rx="2" fill="#FFFFFF"/>
  <rect x="30" y="80" width="38" height="18" rx="9" fill="#E3E8F0"/>
  <g fill="#9AA3B2"><circle cx="40" cy="89" r="3"/><circle cx="49" cy="89" r="3"/><circle cx="58" cy="89" r="3"/></g>
  <rect x="38" y="39" width="28" height="4" rx="2" fill="#9AA3B2"/>
</svg>
